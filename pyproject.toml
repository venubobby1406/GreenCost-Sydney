[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "python scripts/ingest_knowledge.py"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
